services:
  tests_db:
    container_name: db_for_tests
    image: postgres:18-alpine
    env_file: ../.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata_tests:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "$POSTGRES_DB", "-U", "$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_tests:
